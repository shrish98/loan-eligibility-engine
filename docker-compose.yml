# Local stack for the Loan Eligibility Engine.
#
#   postgres : application database (stands in for Amazon RDS when running locally;
#              same engine, so the schema and SQL are identical in both places)
#   n8n      : self-hosted workflow engine that runs Workflows A (crawler),
#              B (matcher) and C (notifier)
#
# Usage:
#   cp .env.example .env        # then fill in the values
#   docker compose up -d
#   open http://localhost:5678

name: loan-engine

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Exposed so the Python scripts/Lambdas on your machine and tools like psql can connect.
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Every .sql file in ./db runs once, the first time the volume is created.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.4
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      # Encrypts the credentials (DB password, AWS keys) that you save inside n8n.
      # Keep it stable: if it changes, n8n can no longer decrypt saved credentials.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Public base URL n8n uses when it prints webhook URLs. Change this to your
      # tunnel URL (ngrok / cloudflared) if an AWS Lambda needs to call the webhook.
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      # n8n's own data (users, credentials, execution history) lives here.
      - n8n_data:/home/node/.n8n
      # Shared folder for exporting/importing workflow JSON files into the repo:
      #   docker compose exec n8n n8n export:workflow --all --separate --output=/workflows
      - ./n8n/workflows:/workflows

volumes:
  pg_data:
  n8n_data:
